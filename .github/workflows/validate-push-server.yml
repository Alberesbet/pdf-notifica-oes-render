name: Validate push server

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PDF-Servidor-Notificacoes-Render
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: PDF-Servidor-Notificacoes-Render/package.json
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Check JavaScript syntax
        run: node --check index.js
